"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "bold #d79921" # Gruvbox Yellow

[character]
success_symbol = "[❯](bold #b8bb26)" # Gruvbox Green
error_symbol = "[❯](bold #fb4934)"   # Gruvbox Red
vimcmd_symbol = "[❮](bold #fabd2f)"  # Gruvbox Yellow/Orange

[git_branch]
format = "[$branch]($style)"
style = "bold #928374" # Gruvbox Gray

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](bold #d3869b) ($ahead_behind$stashed)]($style)" # #d3869b = Gruvbox Purple
style = "#83a598" # Gruvbox Blue
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold #928374" # Gruvbox Gray

[cmd_duration]
format = "[$duration]($style) "
style = "bold #fabd2f" # Gruvbox Yellow

[python]
format = "[$virtualenv]($style) "
style = "bold #928374" # Gruvbox Gray
detect_extensions = []
detect_files = []
